<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Scholar — TOC Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Tajawal', sans-serif;
      background: radial-gradient(ellipse at top, #1a1d2e 0%, #0a0c14 60%);
      color: #e2e8f0; min-height: 100vh; padding: 32px 20px;
    }
    .container { max-width: 860px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 28px; }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #7c83fd 0%, #c084fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 6px;
    }
    .subtitle { color: #64748b; font-size: 0.95rem; }
    .card {
      background: rgba(30,33,48,0.7); border: 1px solid #2d3148;
      border-radius: 16px; padding: 26px; margin-bottom: 20px;
    }
    label {
      display: block; font-size: 0.74rem; color: #94a3b8; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    }
    input[type="number"], select {
      width: 100%; background: #0f1117; border: 1px solid #2d3148;
      border-radius: 10px; padding: 11px 14px; color: #e2e8f0; font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus { border-color: #7c83fd; }

    /* Dropzone */
    #dropzone {
      border: 2px dashed #3a3f5c; border-radius: 14px; padding: 36px 20px;
      text-align: center; cursor: pointer; transition: all 0.2s; background: #0f1117;
    }
    #dropzone:hover, #dropzone.drag { border-color: #7c83fd; background: #141727; }
    #dropzone .big { font-size: 2.4rem; margin-bottom: 8px; }
    #dropzone .hint { color: #64748b; font-size: 0.85rem; margin-top: 4px; }
    #fileName { color: #c084fc; font-weight: 600; margin-top: 10px; word-break: break-all; }

    .row { display: flex; gap: 14px; margin-top: 18px; }
    .row > div { flex: 1; }

    button {
      padding: 13px 24px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 1rem; font-weight: 600; transition: all 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #genBtn {
      width: 100%; margin-top: 20px; color: #fff;
      background: linear-gradient(135deg, #7c83fd 0%, #a855f7 100%);
    }
    #genBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(124,131,253,0.4); }

    #errorMsg { color: #f87171; font-size: 0.9rem; margin-top: 14px; display: none; }
    #loading { display: none; text-align: center; padding: 30px; color: #94a3b8; }
    .spinner {
      width: 38px; height: 38px; border: 3px solid #2d3148; border-top-color: #c084fc;
      border-radius: 50%; margin: 0 auto 14px; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    #results { display: none; }
    .warn-box {
      background: rgba(245,158,11,0.1); border: 1px solid #f59e0b55; color: #fbbf24;
      border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; font-size: 0.88rem;
    }
    .warn-box ul { padding-left: 18px; margin-top: 6px; }
    .chapter {
      background: linear-gradient(135deg, rgba(30,33,48,0.95), rgba(20,22,34,0.95));
      border: 1px solid #2d3148; border-radius: 14px; margin-bottom: 16px; overflow: hidden;
    }
    .chapter-head {
      padding: 16px 20px; border-bottom: 1px solid #2d3148;
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, #7c83fd33 0%, transparent 100%);
    }
    .chapter-title { font-size: 1.05rem; font-weight: 700; color: #fff; flex: 1; }
    .pages { font-size: 0.8rem; color: #c084fc; white-space: nowrap; background: rgba(0,0,0,0.3);
      padding: 4px 10px; border-radius: 8px; }
    .lesson {
      display: flex; align-items: center; gap: 10px; padding: 11px 20px 11px 32px;
      border-bottom: 1px solid #20232f; font-size: 0.94rem;
    }
    .lesson:last-child { border-bottom: none; }
    .lesson-title { flex: 1; color: #cbd5e1; }
    .badge-ok, .badge-warn { font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; }
    .badge-ok { background: rgba(34,197,94,0.15); color: #86efac; }
    .badge-warn { background: rgba(245,158,11,0.15); color: #fbbf24; }
    details { margin-top: 18px; }
    summary { cursor: pointer; color: #94a3b8; font-size: 0.88rem; }
    pre {
      white-space: pre-wrap; background: #0f1117; border: 1px solid #2d3148;
      border-radius: 10px; padding: 16px; margin-top: 10px; font-size: 0.82rem; color: #94a3b8;
      max-height: 320px; overflow: auto;
    }
    .rtl { direction: rtl; text-align: right; }
    .rtl .lesson { padding: 11px 32px 11px 20px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📚 PDF Scholar</h1>
    <p class="subtitle">Extract chapters &amp; lessons from a book's Table of Contents</p>
  </div>

  <div class="card">
    <div id="dropzone">
      <div class="big">📄</div>
      <div>Drag &amp; drop a PDF here, or <strong>click to choose</strong></div>
      <div class="hint">Only the table-of-contents pages are read</div>
      <div id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept="application/pdf" style="display:none" />

    <div class="row">
      <div>
        <label>TOC start page</label>
        <input type="number" id="startPage" min="1" value="1" />
      </div>
      <div>
        <label>TOC end page</label>
        <input type="number" id="endPage" min="1" value="2" />
      </div>
      <div>
        <label>Language</label>
        <select id="lang">
          <option value="en">English</option>
          <option value="ar">العربية / Arabic</option>
        </select>
      </div>
    </div>

    <button id="genBtn" disabled>✨ Execute — Generate</button>
    <div id="errorMsg"></div>
  </div>

  <div class="card" id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Reading pages &amp; extracting… (first run downloads OCR models, please wait)</div>
  </div>

  <div id="results"></div>
</div>

<script>
let chosenFile = null;
const $ = id => document.getElementById(id);
const dz = $('dropzone'), fileInput = $('fileInput'), genBtn = $('genBtn');

dz.onclick = () => fileInput.click();
fileInput.onchange = () => setFile(fileInput.files[0]);
['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
dz.addEventListener('drop', e => { if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]); });

function setFile(f) {
  if (!f) return;
  if (f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')) {
    return showError('Please choose a PDF file.');
  }
  chosenFile = f;
  $('fileName').textContent = '✓ ' + f.name;
  genBtn.disabled = false;
  showError('');
}

function showError(msg) {
  const el = $('errorMsg');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

genBtn.onclick = async () => {
  if (!chosenFile) return showError('Choose a PDF first.');
  const start = parseInt($('startPage').value, 10);
  const end = parseInt($('endPage').value, 10);
  if (!start || !end || start > end) return showError('Check the start/end page numbers.');

  showError('');
  genBtn.disabled = true;
  $('results').style.display = 'none';
  $('loading').style.display = 'block';

  const fd = new FormData();
  fd.append('file', chosenFile);
  fd.append('toc_start_page', start);
  fd.append('toc_end_page', end);
  fd.append('lang', $('lang').value);

  try {
    const res = await fetch('/extract-toc', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error) { showError(data.error); }
    else { render(data); }
  } catch (e) {
    showError('Request failed: ' + e.message);
  } finally {
    $('loading').style.display = 'none';
    genBtn.disabled = false;
  }
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function pageRange(o) {
  const a = o.start_page ?? '?', b = o.end_page ?? '?';
  return `p. ${a}–${b}`;
}

function render(data) {
  const ar = data.language === 'ar';
  const out = $('results');
  let html = '';

  if (data.warnings && data.warnings.length) {
    html += `<div class="warn-box"><strong>⚠ ${data.warnings.length} possible content change(s) flagged:</strong><ul>`
      + data.warnings.map(w => `<li>${esc(w)}</li>`).join('') + `</ul></div>`;
  }

  (data.chapters || []).forEach((ch, ci) => {
    html += `<div class="chapter">
      <div class="chapter-head">
        <span style="color:#7c83fd;font-weight:800">${ci + 1}</span>
        <span class="chapter-title">${esc(ch.title)} ${ch.title_verified ? '' : '<span class="badge-warn">unverified</span>'}</span>
        <span class="pages">${pageRange(ch)}</span>
      </div>`;
    (ch.lessons || []).forEach(ls => {
      html += `<div class="lesson">
        <span class="lesson-title">${esc(ls.title)}</span>
        ${ls.title_verified ? '<span class="badge-ok">✓</span>' : '<span class="badge-warn">unverified</span>'}
        <span class="pages">${pageRange(ls)}</span>
      </div>`;
    });
    html += `</div>`;
  });

  if (!(data.chapters || []).length) {
    html += `<div class="card">No chapters were detected. Try adjusting the page range.</div>`;
  }

  html += `<details><summary>View raw OCR transcription</summary><pre>${esc(data.source_transcription || '')}</pre></details>`;

  out.className = ar ? 'rtl' : '';
  out.innerHTML = html;
  out.style.display = 'block';
}
</script>
</body>
</html>
